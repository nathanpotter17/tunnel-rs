[package]
name = "tunnel"
version = "0.1.0"
edition = "2021"
description = "Software-defined egress engine with traffic observability"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
base64 = "0.22"
anyhow = "1"
socket2 = { version = "0.5", features = ["all"] }
boringtun = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
smoltcp = { version = "0.12", default-features = false, features = [
    "std", "log", "medium-ip", "proto-ipv4", "proto-ipv4-fragmentation",
    "socket-tcp", "socket-udp", "async",
] }

eframe = { version = "0.29", optional = true }

[features]
default = ["gui"]
gui = ["eframe"]

[target.'cfg(unix)'.dependencies]
tun = { version = "0.6", features = ["async"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wintun = "0.4"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
] }
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Rpc",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

